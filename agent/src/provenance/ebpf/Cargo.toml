[package]
name = "provenance-ebpf"
version = "0.1.0"
build = "build.rs"
edition = "2021"
readme = "README.md"

authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aya-ebpf = { workspace = true }
aya-log-ebpf = { workspace = true }
provenance_common = { workspace = true }

[build-dependencies]
which = { workspace = true }

[[bin]] 
name = "provenance"
path = "src/main.rs"

[lib]
name = "provenance"
path = "src/lib.rs"

[profile.release]
panic = "abort"
opt-level = 3
debug = 2
lto = true
codegen-units = 1
