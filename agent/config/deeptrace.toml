[agent]
name = "deeptrace"
user = "user"

[sender.elastic.trace]
node_url = "http://localhost:9200"
username = "elastic"
password = "***"
request_timeout = 30
index_name = "agent1"
bulk_size = 64

[sender.elastic.synchronizer]
node_url = "http://localhost:9200"
username = "elastic"
password = "***"
request_timeout = 30
index_name = "agent1_synchronizer"
bulk_size = 64

[trace]
ebpf = "trace"
sender = "trace"

[synchronizer]
sender = "synchronizer"

[trace.span]
cleanup_interval = 30
max_sockets = 1024

[ebpf.trace]
# 0 = off, 1 = debug, 3 = verbose, 4 = stats
log_level = 1
pids = []
max_buffered_events = 1024
enabled_probes = [
    "sys_enter_read",
    "sys_exit_read",
    "sys_enter_readv",
    "sys_exit_readv",
    "sys_enter_recvfrom",
    "sys_exit_recvfrom",
    "sys_enter_recvmsg",
    "sys_exit_recvmsg",
    "sys_enter_recvmmsg",
    "sys_exit_recvmmsg",

    "sys_enter_write",
    "sys_exit_write",
    "sys_enter_writev",
    "sys_exit_writev",
    "sys_enter_sendto",
    "sys_exit_sendto",
    "sys_enter_sendmsg",
    "sys_exit_sendmsg",
    "sys_enter_sendmmsg",
    "sys_exit_sendmmsg",

    "sys_exit_socket",
    "sys_enter_close"
]
