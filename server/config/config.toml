[elastic]  # Elasticsearch 相关配置
elastic_password = "****"         # Elasticsearch 用户密码
port = 9200                     # Elasticsearch 服务端口     # Elasticsearch 服务地址
kibana_password = "****"         # Kibana 用户密码
bulk_size = 1024                # 批量写入大小
request_timeout = 10            # 请求超时时间（秒）
agent_status_index = "agent_status"  # agent 状态索引名
username = "elastic"

[server]
ip  = "****"
port = 7901
path = "deeptrace/ws"

# ========== agent1 配置 ==========
[[agents]]
  [agents.agent_info]  # agent 基本信息
  agent_name = "****"           # agent 名称
  user_name = "****"            # 登录用户名
  host_ip = "****"      # agent 所在主机 IP
  ssh_port = "****"                   # SSH 端口
  host_password = "****"           # 主机密码
  deeptrace_port = 52001          # deeptrace 服务端口
  code_path = "****"        # 代码路径
  workers = 16                    # 工作线程数

  [agents.span]
  batch_size = 1024

  [agents.sender]  # 数据发送相关配置
  index_name = "spans_agent1"     # Elasticsearch 索引名
  mem_buffer_size = 16      # 内存缓冲区大小
  file_buffer_size = 32     # 文件缓冲区大小
  file_size_limit = 1024  # 文件大小上限
  batch_size = 1024               # 批量发送大小

  [agents.trace]  # eBPF 配置
  pids = [3056354, 3056217, 3056210]  # 需要采集的进程 PID 列表

  [agents.api]  # agent API 服务配置
  port = 7899                   # API 服务端口
  address = "0.0.0.0"           # API 监听地址
  workers = 1                   # API 服务线程数
  ident = "deeptrace"           # 服务标识

