[book]
authors = ["DeepShield AI Team"]
language = "en"
multilingual = false
src = "src"
title = "DeepTrace Documentation"
description = "Comprehensive documentation for DeepTrace - A non-intrusive distributed tracing framework for microservices"

[build]
extra-watch-dirs = ["assets"]
build-dir = "book"
create-missing = true

[preprocessor.links]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
copy-fonts = true
mathjax-support = true
git-repository-url = "https://github.com/DeepShield-AI/DeepTrace"
edit-url-template = "https://github.com/DeepShield-AI/DeepTrace/edit/main/docs/{path}"
site-url = "/DeepTrace/"
cname = "deeptrace.docs"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
copyable = true
copy-js = true
line-numbers = true
editable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.print]
enable = true
